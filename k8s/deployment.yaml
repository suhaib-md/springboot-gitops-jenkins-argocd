apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
      - name: backend-app
        # Set to your Nexus Docker registry. The app/ Jenkins pipeline rewrites this line
        # with <REGISTRY_HOST>/backend-app:v<BUILD_NUMBER> on every build.
        image: registry.example.com:5000/backend-app:v3
        ports:
        - containerPort: 8084
      imagePullSecrets:
      - name: nexus-registry-credentials
